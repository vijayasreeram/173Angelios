plugins {
    id 'com.android.application'
}

android {
    namespace 'org.sih.itantra.demo'
    compileSdk 34

    defaultConfig {
        applicationId "org.sih.itantra.demo"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
